# HPP-SAM with Voronoi Tokenizer (显存优化版)
#
# 基于Point-SAM (ICLR 2025)的Voronoi分词器替代传统FPS+KNN：
# - 显存节省：18-26%
# - 时间提升：最高163%
# - 质量保持：与KNN相当的性能
#
# 主要改动：
# - 使用VoronoiGrouper替代KNNGrouper
# - 每个点只属于一个cell，减少L*K的计算量
# - 使用scatter-max聚合替代KNN的group操作
#
# 使用方法：
#   accelerate launch train.py --config hpp_voronoi ...
#
# 模型配置：
#   - Encoder: EVA02 Base + Voronoi分词器
#   - Decoder: 4层TwoWayTransformer + HRA
#   - 显存优化: Gradient Checkpointing + CPU Offload
#
# 参考Point-SAM论文 Table 9 的效率对比：
#   PartNet-Mobility: KNN 2524MB -> Voronoi 2078MB (-21.5%)
#   KITTI360: KNN 3890MB -> Voronoi 3172MB (-18.4%)

_target_: hpp_sam.model.hyperpoint_sam.HPPSAM
pc_encoder:
  _target_: hpp_sam.model.point_cloud_encoder.PointCloudEncoder
  patch_embed:
    _target_: hpp_sam.model.point_cloud_encoder.PatchEmbed
    # 输入通道：xyz(3) + 相对坐标(3) = 6
    in_channels: 6
    # 输出特征维度
    out_channels: 512
    # Voronoi分词器配置（关键优化）
    # 每个点只属于一个cell，减少L*K的计算量
    use_voronoi: true
    voronoi_hidden_channels: 256
    num_patches: 512
    patch_size: 64  # 保留用于fallback
    radius: null
    centralize_features: false
    use_gradient_checkpointing: false
  transformer:
    _target_: timm.create_model
    model_name: eva02_base_patch14_448
    pretrained: false
  embed_dim: 256
mask_encoder:
  _target_: hpp_sam.model.prompt_encoder.MaskEncoder
  embed_dim: 256
  in_channels: 4
  radius: null
  centralize_features: false
  use_gradient_checkpointing: false
  # Voronoi模式下的mask编码器
  use_voronoi: true
  voronoi_hidden_channels: 128
mask_decoder:
  _target_: hpp_sam.model.mask_decoder.MaskDecoder
  transformer_dim: 256
  curvature: ${..hra_curvature}
  use_gradient_checkpointing: false
  transformer:
    _target_: hpp_sam.model.transformer.TwoWayTransformer
    depth: 4
    embedding_dim: 256
    num_heads: 8
    mlp_dim: 2048
    use_hyperbolic_cross_attn: true
    curvature: 0.01
    use_gradient_checkpointing: false
    q_chunk_size: 128
    k_chunk_size: 128
    chunk_size: 128
    use_ball_query: true
    k_neighbors: 64

prompt_iters: 10

hra_curvature: 0.01
hra_type: block_diagonal
block_size: 8
tau_min: 0.1
tau_max: 2.0
